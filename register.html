<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account — Lost & Found Portal</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-shell"><div class="auth-visual"><a class="brand light-brand" href="index.html"><span class="brand-mark">L</span><span>Lost & Found Portal</span></a><div><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Small reports can make a big difference.</h1><p>Create an account so your lost and found reports stay connected to you.</p></div><div class="visual-stat">✨ One account • Your reports • Your control</div></div><div class="auth-card"><a class="back-link" href="index.html">← Home</a><span class="eyebrow">GET STARTED</span><h1>Create account</h1><form id="registerForm"><div class="field"><label>Full name</label><input type="text" id="name" placeholder="Your name" required></div><div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required></div><div class="field"><label>Phone number</label><input type="tel" id="phone" placeholder="10 digit phone number" required></div><div class="field"><label>Password</label><input type="password" id="password" placeholder="At least 6 characters" minlength="6" required></div><div class="field"><label>Confirm password</label><input type="password" id="confirmPassword" placeholder="Repeat password" required></div><button class="btn btn-primary wide" type="submit">Create account <span>→</span></button></form><p class="switch-auth">Already registered? <a href="login.html">Login</a></p></div></div><script src="js/auth.js"></script>
