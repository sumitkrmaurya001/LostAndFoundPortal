<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Report Found Item — Lost & Found Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body class="soft-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">L</span><span>Lost & Found Portal</span></a><nav><a href="index.html">Home</a><a href="index.html#items">Browse</a><span id="authArea"></span></nav></header>
<main class="form-page"><a class="back-link" href="index.html">← Back home</a><div class="form-card"><div class="form-intro"><span class="eyebrow">BE A GOOD NEIGHBOR</span><h1>Report something you found</h1><p>A simple report can help a missing belonging reach its owner.</p></div><form id="foundForm"><div class="form-grid"><div class="field full"><label>Item name</label><input type="text" id="itemName" placeholder="e.g. Blue backpack" required></div><div class="field"><label>Category</label><select id="category"><option>Bag</option><option>Mobile</option><option>Wallet</option><option>ID Card</option><option>Keys</option><option>Others</option></select></div><div class="field"><label>Date found</label><input type="date" id="date" required></div><div class="field full"><label>Description</label><textarea id="description" placeholder="Color, brand, identifying marks..." required></textarea></div><div class="field"><label>Location found</label><input type="text" id="location" placeholder="e.g. Cafeteria, Gate 2"></div><div class="field"><label>Contact number</label><input type="tel" id="contact" placeholder="Phone number" required></div><div class="field full"><label>Photo <span class="optional">(recommended)</span></label><input type="file" id="image" accept="image/*"><div id="imagePreview" class="image-preview">📷 Add a clear photo to improve matching</div></div></div><button class="btn btn-primary wide" type="submit">Publish found report <span>→</span></button></form></div></main><script src="js/auth.js"></script>
<script src="js/found.js"></script></body></html>
